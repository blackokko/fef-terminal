[project]
name = "fef-sidecar"
version = "0.1.0"
description = "Python sidecar process for fef-terminal: QuantData client, IBKR market data, FEF signal engine, FastAPI WebSocket server."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "ib_async>=1.0.3",
    # 2026-09-30: fef_sidecar.et_time needs the IANA database; Windows has none, so
    # zoneinfo reads this package. Declared explicitly (it also arrives via ib_async).
    "tzdata>=2025.2",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "websockets>=14.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
fef-sidecar = "fef_sidecar.main:run"
fef-mcp = "fef_quant_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fef_sidecar", "src/fef_quant_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
